# macOS (and Linux) environment for PatientGUI. Used by start.sh.
#
# patientgui.yml is a full `conda env export` of a win-64 machine - it pins
# Windows-only builds (pywin32, vc14_runtime, m2w64-*, mkl win builds) and
# cannot be solved on any other platform. This file is the portable
# counterpart: top-level dependencies only, same versions where a version was
# pinned on Windows, solved fresh for the host platform.
#
# Differences from the Windows environment, all deliberate:
#   - xipppy is NOT installed. Ripple ships it only as a win_amd64 wheel, so
#     live Ripple mode is unavailable here; simulation and Quattrocento modes
#     do not import it. If you have a macOS/Linux build of xipppy, pip install
#     it into this environment and live mode works unchanged.
#   - torch comes from pip (CPU/MPS build) instead of conda+CUDA.
#   - liblsl comes from conda-forge: the pylsl wheel does not bundle the
#     library on macOS. If pylsl still cannot find it at runtime, set
#     PYLSL_LIB="$CONDA_PREFIX/lib/liblsl.dylib" or start the server with
#     --no-lsl.
name: patientgui
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - liblsl
  - pip:
      - scikit-learn-extra==0.3.0 
      - aiofiles==24.1.0
